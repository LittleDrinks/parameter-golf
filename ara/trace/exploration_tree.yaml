questions:
  - id: q-harness-001
    title: Can every run be reconstructed from structured evidence?
    status: active
    children:
      - id: exp-harness-metrics
        type: engineering
        status: proposed
        description: Save train metrics, eval metrics, config snapshot, and git state for each run.
      - id: exp-stage0-worker-reliability
        type: engineering
        status: completed
        description: Verify 3 consecutive worker tasks have durable prompt/capture/run-root metadata and no cross-run process interference.
        evidence:
          worker_tasks:
            - session: pg-eval-baseline-seed2-start
              prompt: ara/trace/worker-captures/pg-eval-baseline-seed2-start-prompt.md
              final_capture: ara/trace/worker-captures/pg-eval-baseline-seed2-start-final.txt
              run_root: /data/zsm/parameter-golf/runs/eval_baseline_seed2_textvqa_val_ocr
              run_root_files: command.sh, env.txt, git_commit.txt, git_diff.patch, pid.txt, logs/stdout.log, logs/stderr.log, status.json
              interference: none; first shell quoting attempt launched no process, later pid.txt repaired to Python lmms_eval PID 1259059
            - session: pg-stage3-sample-evidence
              prompt: ara/trace/worker-captures/pg-stage3-sample-evidence-prompt.md
              final_capture: ara/trace/worker-captures/pg-stage3-sample-evidence-final.txt
              run_root: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence
              run_root_files: command.sh, env.txt, git_commit.txt, git_diff.patch, pid.txt, logs/build.log, status.json
              interference: none; no GPU/process management actions
            - session: pg-stage3-sample-evidence-repair
              prompt: ara/trace/worker-captures/pg-stage3-sample-evidence-repair-prompt.md
              final_capture: ara/trace/worker-captures/pg-stage3-sample-evidence-repair-final.txt
              run_root: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence
              run_root_files: command.sh, env.txt, git_commit.txt, git_diff.patch, pid.txt, logs/rebuild.log, status.json
              interference: none; repaired evidence artifact using cached Arrow validation data, no GPU/process management actions
          acceptance: 3 consecutive hardened worker tasks have complete prompt/capture/run-root metadata; zero cross-run kills or GPU contention.
      - id: exp-local-env-gate
        type: engineering
        status: active
        description: Build or assess a local CPU-only environment/data-cache gate before relying on server-only training.
        worktree: /tmp/pg-worktrees/local-env-gate
        branch: exp/local-env-gate
        commit: 101959c882dd9d05be79668f80456da038c01c77
        worker_session: pg-local-env-worker
        prompt: agent-prompts/local-env-worker.md
        capture: ara/trace/worker-captures/pg-local-env-worker-latest.txt
        constraints:
          cpu_only: true
          no_gpu_training: true
          no_server_credentials: true
        interpretation: Gate can catch environment/config breakage only; full train plus matched eval remains required for proof-of-idea.
  - id: q-ocr-001
    title: Do OCR tokens improve TextVQA exact match?
    status: active
    children:
      - id: exp-ocr16
        type: experiment
        status: completed
        config: configs/experiments/ocr16.yaml
        run_id: ocr16_seed1
        remote_run_root: /data/zsm/parameter-golf/runs/ocr16_seed1
        result:
          metric: textvqa_val exact_match
          value: 0.7076800000000036
          stderr: 0.006091340115678913
          completed_steps: 1024
          train_runtime_seconds: 3011.4045
          interpretation: noisy loss with downward overall trend; no demonstrated improvement over baseline seed1; likely train/eval OCR prompt mismatch
      - id: exp-ocr16-eval-ocr
        type: analysis
        status: completed
        description: Eval existing ocr16_seed1 merged model with TASK=textvqa_val_ocr to test prompt/eval alignment without retraining.
        worktree: /home/zsm/pg-worktrees/pg-eval-ocr16-ocr
        branch: exp/eval-ocr16-ocr
        commit: 101959c882dd9d05be79668f80456da038c01c77
        remote_run_root: /data/zsm/parameter-golf/runs/eval_ocr16_seed1_textvqa_val_ocr
        result:
          metric: textvqa_val_ocr exact_match
          value: 0.7262000000000036
          stderr: 0.005938970135743878
          result_path: /data/zsm/parameter-golf/runs/eval_ocr16_seed1_textvqa_val_ocr/eval/outputs__merged/20260604_193246_results.json
          interpretation: OCR16 aligned OCR eval beats best baseline seed2 on the same OCR eval by +0.012840000000000036 exact_match; proceed with OCR direction only through Stage 3 sample-level evidence before any new training variant.
        note: Patched textvqa_val_ocr.yaml in isolated worktree only to use dataset_path lmms-lab/textvqa; eval completed on GPU2 at 2026-06-04 19:52 CST.
      - id: exp-baseline-eval-ocr
        type: analysis
        status: completed
        description: Eval existing baseline merged models with TASK=textvqa_val_ocr for a fair OCR-at-eval comparison.
        worktree: /home/zsm/pg-worktrees/pg-eval-baseline-ocr
        branch: exp/eval-baseline-ocr
        commit: 101959c882dd9d05be79668f80456da038c01c77
        remote_run_root: /data/zsm/parameter-golf/runs/eval_baseline_seed2_textvqa_val_ocr
        result:
          metric: textvqa_val_ocr exact_match
          value: 0.7133600000000039
          stderr: 0.00602570858180051
          result_path: /data/zsm/parameter-golf/runs/eval_baseline_seed2_textvqa_val_ocr/eval/textvqa_qwen3vl_lora_seed2__merged/20260604_195729_results.json
          interpretation: Baseline seed2 with OCR-at-eval improves over its non-OCR eval but remains below OCR16 aligned eval.
        note: Best baseline seed2 OCR eval completed after OCR16 completion. Run root records command/env/git/pid/logs/status; pid.txt records Python lmms_eval PID 1259059 and launcher_pid records bash parent 1259057.
      - id: decision-ocr-stage2-continue
        type: decision
        status: completed
        description: Continue OCR direction after aligned eval because OCR16 exceeds best baseline seed2 on textvqa_val_ocr.
        evidence:
          ocr16_exact_match: 0.7262000000000036
          baseline_seed2_exact_match: 0.7133600000000039
          delta: 0.012840000000000036
          minimum_positive_delta: 0.001
        next_gate: passed; repaired Stage 3 sample-level evidence exists before any new OCR training variants.
      - id: exp-stage3-sample-evidence
        type: analysis
        status: completed
        description: Build per-sample TextVQA OCR evidence with question, prediction, gold answers, OCR tokens, prompt snapshot, and lmms-eval-compatible scores.
        remote_run_root: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence
        artifact:
          jsonl: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence/samples_textvqa_val_ocr_ocr16_vs_baseline_seed2.jsonl
          summary: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence/summary.json
          build_log: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence/logs/build.log
          repair_log: /data/zsm/parameter-golf/runs/stage3_textvqa_val_ocr_sample_evidence/logs/rebuild.log
        result:
          total_samples: 5000
          ocr16_better: 229
          baseline_seed2_better: 149
          tied: 4622
          ocr16_exact_match_mean: 0.7262000000000036
          baseline_seed2_exact_match_mean: 0.7133600000000039
          aggregate_match: true
          prompt_snapshot: matches utils.py comma-separated OCR-token prompt
          scoring: fractional TextVQA accuracy via EvalAIAnswerProcessor and other-answer matching rule
        note: Initial Stage 3 artifact used boolean normalized matches and space-joined OCR prompt snapshots; repair rebuilt all 5000 records from cached Arrow validation data and now matches lmms-eval aggregate means to floating precision.
      - id: exp-ocr32
        type: experiment
        status: deferred
        config: configs/experiments/ocr32.yaml
        falsifying_check: Do not train until Stage 4 planning selects a concrete OCR variant with an eval-only or short-run check; reject if expected textvqa_val_ocr delta is below +0.003 over OCR16 aligned eval or if sample evidence shows gains are dominated by answer-style artifacts.
      - id: exp-ocr-recoverable-errors
        type: analysis
        status: completed
        description: Compare baseline predictions, OCR tokens, and gold answers to estimate how many validation failures are recoverable by OCR-token prompting before retraining.
        remote_note: /data/zsm/parameter-golf/runs/analysis_ocr_recoverable/ocr_analysis_note_2026-06-04.md
        result:
          recoverable_failure_estimate: unavailable
          reason: Validation gold/OCR tokens for TextVQA val are not cached locally; result JSONs contain aggregate metrics and submissions only.
      - id: exp-answer-style-alignment
        type: analysis
        status: proposed
        description: Compare short-answer prompt/generation variants on existing merged models to isolate exact-match answer-style effects from training changes.
        falsifying_check: Run eval-only prompt/generation variants on existing OCR16 and baseline seed2 merged models; stop if OCR16 advantage disappears or if any prompt-only baseline reaches within 0.001 of OCR16 aligned eval.
        minimum_acceptable_delta: +0.001 over baseline seed2 textvqa_val_ocr for preserving the OCR-training hypothesis; +0.003 for justifying a new training run.
      - id: exp-prompt-alignment-variant
        type: experiment
        status: planned
        description: Train or fine-tune only with prompt text exactly matching textvqa_val_ocr prompt construction.
        falsifying_check: First run a no-training prompt reproduction check on existing models; launch training only if reproduced prompts preserve OCR16 > baseline seed2 and if the current train/eval prompt mismatch is the only unresolved prompt variable.
        minimum_acceptable_delta: +0.003 exact_match over eval_ocr16_seed1_textvqa_val_ocr after same textvqa_val_ocr eval; stop if delta <= 0 or stderr-overlapped with no sample-level wins.
      - id: exp-question-relevant-ocr-selection
        type: experiment
        status: planned
        description: Replace first-16 OCR token inclusion with question-relevant OCR token selection.
        falsifying_check: Offline sample-level oracle/filter audit must show more OCR16-fixable baseline failures than OCR-selection-induced regressions; do not train if selected tokens omit gold-supporting OCR in more than 10% of current OCR16 wins.
        minimum_acceptable_delta: +0.003 exact_match over eval_ocr16_seed1_textvqa_val_ocr, with sample evidence showing net new wins on OCR-dependent questions.
        latest_evidence: /data/zsm/parameter-golf/runs/analysis_failure_taxonomy/failure_taxonomy.md
        current_read: weakened; OCR16 wins and baseline wins have similar gold-in-OCR overlap, and many OCR16 losses have the wrong OCR16 prediction present in OCR tokens.
      - id: exp-ocr-dropout
        type: experiment
        status: planned
        description: Randomly drop OCR tokens during training to reduce prompt brittleness while preserving OCR-conditioned gains.
        falsifying_check: Short-run or ablation must not reduce textvqa_val_ocr below current OCR16 aligned eval by more than 0.001 and must improve non-OCR textvqa_val relative to ocr16_seed1.
        minimum_acceptable_delta: +0.002 on textvqa_val_ocr or recovery of non-OCR textvqa_val to baseline seed2 while keeping OCR eval advantage.
  - id: q-lora-001
    title: Which LoRA settings improve accuracy under the same inference budget?
    status: active
    children:
      - id: exp-lora-small-sweep
        type: experiment
        status: proposed
        description: Sweep conservative LoRA hyperparameters on the reliable eval surface; do not wait for OCR to be fully exhausted.
        falsifying_check: Start with the smallest 2-3 run sweep that changes one training-policy variable at a time; reject a setting if it fails to exceed the matched baseline by +0.003 exact_match or if improvement is not stable under the same eval task.
        candidate_axes: rank, learning rate, dropout, target modules, schedule, train steps
  - id: q-portfolio-001
    title: What non-OCR directions should be explored in parallel?
    status: active
    rationale: User judged OCR-only strategy too narrow; literature suggests OCR is useful but high-ceiling gains often come from text-aware pretraining, OCR-copy/layout modeling, extra data, and answer generation control rather than raw OCR-token inclusion alone.
    children:
      - id: exp-answer-style-controls
        type: analysis
        status: active
        description: Eval-only controls for answer style, prompt wording, and generation length on existing merged models.
        falsifying_check: If baseline prompt/generation controls reach within 0.001 exact_match of OCR16 aligned eval, downgrade OCR training as the explanation for the current gain.
        cost: low; no training; existing merged models only
      - id: exp-answer-style-audit
        type: analysis
        status: completed
        description: CPU-only audit of TextVQA prompt construction, generation controls, and answer-style eval matrix.
        remote_run_root: /data/zsm/parameter-golf/runs/analysis_answer_style_audit
        artifact:
          report: /data/zsm/parameter-golf/runs/analysis_answer_style_audit/answer_style_audit.md
          status: /data/zsm/parameter-golf/runs/analysis_answer_style_audit/status.json
        result:
          headline: max_new_tokens is the smallest zero-code eval-only control; prompt/post_prompt/ocr_max_tokens require custom task YAML plus include_path.
          ocr16_textvqa_val_ocr: 0.7262
          baseline_seed2_textvqa_val_ocr: 0.7134
          blockers_flattened:
            config_only: max_new_tokens, temperature/top_p, system_prompt, enable_thinking
            small_script: post_prompt, pre_prompt, ocr_max_tokens via custom task YAML
            gpu_eval: every matrix row needs a serial GPU eval
            drop: until token changes and apply_chat_template changes
          next_smallest_check: serial OCR16 max_new_tokens=32 eval, only if GPU2 remains free and no other user needs it.
      - id: exp-data-augmentation-audit
        type: analysis
        status: active
        description: Audit low-cost data augmentation or instruction-tuning sources for TextVQA-like reading questions, including ST-VQA/TextCaps/TextOCR-derived examples if already available in cache.
        falsifying_check: Do not train if candidate data cannot be converted into the existing short-answer format with answer-normalization compatibility and without adding noisy long-form answers.
        cost: low-to-medium; offline data inspection before any GPU run
      - id: exp-data-audit
        type: analysis
        status: completed
        description: CPU-only audit of locally available TextVQA-like data and instruction sources.
        remote_run_root: /data/zsm/parameter-golf/runs/analysis_data_audit
        artifact:
          report: /data/zsm/parameter-golf/runs/analysis_data_audit/data_audit.md
          status: /data/zsm/parameter-golf/runs/analysis_data_audit/status.json
        result:
          available: TextVQA cache, TextVQA train parquet, and existing prepared TextVQA datasets.
          unavailable: DocVQA, ST-VQA, TextOCR, OCR-VQA, OCRBench, and external instruction data are not cached locally or need network.
          blocker: data-audit had heredoc quoting errors while writing markdown, then recovered; report/status were verified.
          next_smallest_check: prompt-template ablation on existing TextVQA only; no new dataset before cache/download constraints are addressed.
      - id: exp-visual-grounding-audit
        type: analysis
        status: completed
        description: Check whether current failures are OCR-only, visual-object grounding, layout/spatial, or answer-format failures using the repaired sample-level artifact.
        falsifying_check: If most OCR16 wins are not tied to OCR-token/gold-answer evidence, prioritize prompt/style or LoRA over OCR-selection training.
        cost: low; sample artifact analysis
        remote_run_root: /data/zsm/parameter-golf/runs/analysis_failure_taxonomy
        artifact:
          report: /data/zsm/parameter-golf/runs/analysis_failure_taxonomy/failure_taxonomy.md
          summary: /data/zsm/parameter-golf/runs/analysis_failure_taxonomy/summary.json
        result:
          ocr16_better: 229
          baseline_better: 149
          tied: 4622
          ocr16_win_gold_in_ocr_fraction: 0.8079
          baseline_win_gold_in_ocr_fraction: 0.7987
          baseline_win_ocr16_pred_in_ocr_fraction: 0.5235
          interpretation: weakens question-relevant OCR selection as the immediate next training bet; answer-style and seed robustness controls should come first.
          caveat: worker did not write status.json for this analysis; summary.json/report exist and were verified.
      - id: exp-seed-robustness-controls
        type: analysis
        status: completed
        description: Complete aligned OCR eval for baseline seed1/seed3 or a cheaper subset check to estimate whether the OCR16 advantage is robust to baseline seed variance.
        falsifying_check: If another baseline seed with OCR-at-eval reaches within 0.001 of OCR16 aligned eval, treat OCR16 seed1 as inconclusive and require repeat seed before new OCR variants.
        cost: medium; eval-only GPU
        latest_result:
          seed1_textvqa_val_ocr: 0.7134200000000036
          seed2_textvqa_val_ocr: 0.7133600000000039
          seed3_textvqa_val_ocr: 0.7154200000000039
          ocr16_seed1_textvqa_val_ocr: 0.7262000000000036
          baseline_ocr_mean_seed1_2_3: 0.7140666666666705
          best_baseline_ocr: 0.7154200000000039
          current_delta_vs_best_baseline_ocr: 0.010780000000000012
          current_delta_vs_baseline_ocr_mean: 0.012133333333333103
          remaining_gap: none for baseline seed1-3 aligned OCR evals
          interpretation: OCR16 remains above all three aligned baseline OCR evals; seed3 narrows but does not eliminate the observed OCR16 advantage.
      - id: exp-seed-robustness-preflight
        type: analysis
        status: completed
        description: CPU-only preflight for serial baseline seed1/seed3 aligned OCR evals.
        remote_run_root: /data/zsm/parameter-golf/runs/analysis_seed_robustness_preflight
        artifact:
          report: /data/zsm/parameter-golf/runs/analysis_seed_robustness_preflight/seed_robustness_preflight.md
          status: /data/zsm/parameter-golf/runs/analysis_seed_robustness_preflight/status.json
        result:
          seed1_merged: /data/zsm/parameter-golf/outputs/textvqa_qwen3vl_lora_seed1/merged
          seed3_merged: /data/zsm/parameter-golf/outputs/textvqa_qwen3vl_lora_seed3/merged
          missing: seed1 and seed3 aligned textvqa_val_ocr result JSONs
          available_gpu_at_preflight: GPU2
          launch_policy: serial only; seed1 then seed3; start only if GPU2 memory.used < 1000 MiB and no zsm eval/training process is active.
      - id: exp-baseline-seed1-eval-ocr
        type: analysis
        status: completed
        description: Serial GPU eval of baseline seed1 merged model on aligned `textvqa_val_ocr`.
        worktree: /home/zsm/pg-worktrees/pg-seed-robustness-ocr
        branch: exp/seed-robustness-ocr
        commit: d659cbdf335a66f43e835dd2c3899ff76edeb5d6
