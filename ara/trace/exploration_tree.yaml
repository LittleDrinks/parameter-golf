        result:
          metric: textvqa_val_ocr exact_match
          value: 0.7134200000000036
          stderr: 0.006032748920011863
          result_path: /data/zsm/parameter-golf/runs/eval_baseline_seed1_textvqa_val_ocr/eval/textvqa_qwen3vl_lora_seed1__merged/20260604_221119_results.json
          interpretation: Baseline seed1 aligned OCR eval matches seed2 aligned OCR eval within 0.00006; OCR16 remains +0.01278 over the best aligned baseline observed so far.
        note: Dedicated worktree branch committed the dataset_path patch. Server-side push failed due missing GitHub credentials, which is expected for the public shared server per user instruction; commit is sufficient for server record and manual push can be done from VS Code credential environment.
      - id: exp-baseline-seed3-eval-ocr
        type: analysis
        status: completed
        description: Serial GPU eval of baseline seed3 merged model on aligned `textvqa_val_ocr`.
        worktree: /home/zsm/pg-worktrees/pg-seed-robustness-ocr
