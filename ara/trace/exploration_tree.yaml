        remote_run_root: /data/zsm/parameter-golf/runs/eval_baseline_seed3_textvqa_val_ocr
        result:
          metric: textvqa_val_ocr exact_match
          value: 0.7154200000000039
          stderr: 0.006017714457953059
          result_path: /data/zsm/parameter-golf/runs/eval_baseline_seed3_textvqa_val_ocr/eval/textvqa_qwen3vl_lora_seed3__merged/20260604_224425_results.json
