task: textvqa_val_ocr_cond_pre_a_ge5
test_split: validation
dataset_path: lmms-lab/textvqa
output_type: generate_until
doc_to_visual: !function utils.textvqa_doc_to_visual
doc_to_text: !function utils.textvqa_doc_to_text_conditional_pre_a
doc_to_target: "answer"
generation_kwargs:
  until:
    - "ASSISTANT:"
  max_new_tokens: 16
process_results: !function utils.textvqa_process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  - metric: submission
    aggregation: !function utils.textvqa_aggregate_submissions
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Answer briefly using image text when possible. "
    post_prompt: "\nAnswer the question using a single word or phrase."
    ocr: true
    ocr_max_tokens: 16
    conditional_pre_prompt_min_ocr_tokens: 5
